name: Release plugin

"on":
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    name: Build, verify, and publish
    runs-on: ubuntu-latest
    env:
      PUBLISH_TOKEN: ${{ secrets.JETBRAINS_MARKETPLACE_TOKEN }}
      CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
      PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
      PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}

    steps:
      - name: Check out release commit
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Validate tag and release notes
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          configured_version="$(sed -n 's/^pluginVersion=//p' gradle.properties | tr -d '\r')"
          if [[ "$version" != "$configured_version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match pluginVersion=$configured_version" >&2
            exit 1
          fi
          test -f "docs/releases/$version.md"
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Test and build plugin
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew clean test buildPlugin verifyPlugin --no-daemon

      - name: Create checksum
        shell: bash
        run: |
          archive="build/distributions/merge-hell-runner-$VERSION.zip"
          test -f "$archive"
          (cd "$(dirname "$archive")" && sha256sum "$(basename "$archive")") > "$archive.sha256"
          echo "ARCHIVE=$archive" >> "$GITHUB_ENV"

      - name: Preserve release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: merge-hell-runner-${{ github.ref_name }}
          path: |
            build/distributions/*.zip
            build/distributions/*.zip.sha256
          if-no-files-found: error

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" \
              --title "Merge Hell Runner $VERSION" \
              --notes-file "docs/releases/$VERSION.md"
            gh release upload "$GITHUB_REF_NAME" "$ARCHIVE" "$ARCHIVE.sha256" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$ARCHIVE" "$ARCHIVE.sha256" \
              --title "Merge Hell Runner $VERSION" \
              --notes-file "docs/releases/$VERSION.md"
          fi

      - name: Publish to JetBrains Marketplace
        if: >-
          env.PUBLISH_TOKEN != '' &&
          env.CERTIFICATE_CHAIN != '' &&
          env.PRIVATE_KEY != '' &&
          env.PRIVATE_KEY_PASSWORD != ''
        run: ./gradlew publishPlugin --no-daemon
