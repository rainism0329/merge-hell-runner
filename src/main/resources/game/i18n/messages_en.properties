chapter.3.story.1=The trail rises above the city. Shoot bridge counterweights to lower crossings; survey rifles lock before firing.
chapter.3.story.2=The citadel assembles its own guards. Let shield rams commit, then strike their open chassis.
chapter.3.story.3=The crown routes every machine below. Cable wasps mark two lanes; the gap between them stays open.
chapter.3.story.4=The Architect hangs from the gantry. Break both construction claws to reach its command core.
chapter.4.story.1=The stolen power leads underground. Conveyors feed the furnaces; coolant valves can quiet the molten channels.
chapter.4.story.2=Drills stir below the floor. Watch the emerging rubble, and use the raised pipes to evade welding dives.
chapter.4.story.3=These furnaces are forging something alive. Break coolant tanks to cross the trenches before heat returns.
chapter.4.story.4=The siege engine seals the descent. Strip its front armor or wait for cooling, then hit the rear vent.
chapter.5.story.1=The metal gives way to living tissue. Destroy egg nests before they hatch; leap between the acid banks.
chapter.5.story.2=Resin seals the old service tunnels. Break the membranes while watching the drifting spore pods.
chapter.5.story.3=Every conduit feeds the same heartbeat. Lurkers commit to their pounce; step aside after the warning locks.
chapter.5.story.4=This is the source. Destroy both brood organs, then strike the heart before it grows them back.
chapter.3.victory=The citadel falls silent. Its power lines lead down to the geothermal foundry.
chapter.4.victory=The siege engine breaks. Behind its furnace door, a living hive is breathing.
chapter.5.victory=The rootheart stops. City, citadel and foundry are free. The repairer can finally go home.
