blueprint.story.victory=蓝图已通过。城塞终于不再重建自己的错误。
blueprint.story.route1=装配场：高架步道与扫描炮塔共用电源。青色支撑标明了坍塌关联结构。
blueprint.story.route2=修订大厅：旧蓝图把维修人员识别为入侵者。断开这里的扫描网络。
blueprint.story.route3=核心入口：两处可重建支撑为建筑师供能。利用它们的重建间隔组织进攻。
