chapter.3.story.1=追踪信号，登上城巅。击断配重可放下桥面；测距枪会先锁定再开火。
chapter.3.story.2=堡垒正在组装守军。盾卫冲撞后装甲张开，趁机攻击底盘。
chapter.3.story.3=城冠控制着下方所有机器。索翼蜂标出双线，线间留有躲避空间。
chapter.3.story.4=构架师悬挂于巨型桁架。拆掉两只构装爪，指挥核心才会暴露。
chapter.4.story.1=失窃的能源流向地下。传送带正为熔炉送料；冷却阀能暂时压住熔流。
chapter.4.story.2=钻兽潜伏在地板下。留意翻起的碎石，借高架管道避开焊机俯冲。
chapter.4.story.3=熔炉铸造的竟是活物。打破冷却罐，趁温度回升前穿越战壕。
chapter.4.story.4=攻城兽封住下降通道。拆掉前装甲，或等它冷却，再打击后方散热口。
chapter.5.story.1=金属尽头是活体组织。卵巢会孵出猎兽；先摧毁卵巢，再跃过酸池。
chapter.5.story.2=树脂封住了旧检修隧道。击破肉膜开路，同时留意漂浮的孢囊。
chapter.5.story.3=所有导管都汇向同一颗心脏。潜猎兽起跳后不会转向，锁定后及时避让。
chapter.5.story.4=这里就是源头。摧毁两侧育巢器官，趁再生前猛攻心脏。
chapter.3.victory=构架城终于安静下来。沿着输电干线，前往地下的地热铸造厂。
chapter.4.victory=攻城兽轰然倒塌。熔炉闸门后，一座活体巢穴正缓缓呼吸。
chapter.5.victory=根源之心停止跳动。城市、堡垒和熔炉重获自由，修复者终于可以回家。
