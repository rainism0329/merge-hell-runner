singularity.story.bossEntry=它会参考近期移动与实际射击，再提前公布应对。依次在双锚点按 E，可以打断它的循环。
singularity.story.armed=一个锚点已同步。八秒内赶到另一处；重复操作当前锚点不会延长时间。
singularity.story.resonance=双锚信号击穿了约束，趁停火窗口攻击敞开的核心。
singularity.story.bossStage2=它已重置模式记忆。每轮仍各出现一次四种回响，观察新的预警再行动。
singularity.story.bossStage3=约束正在失效。回响变快，但路径仍会提前锁定；留意双锚点的位置。
singularity.story.bossDefeated=五个区域已恢复稳定，最后一次合并完成。归途已经畅通。
